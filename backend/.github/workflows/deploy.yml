name: Deploy Frontend to LWS Production

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '26'
  PHP_VERSION: '8.4'

jobs:
  build-and-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, bcmath, curl
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build
        env:
          CI: true

      - name: Deploy build folder to LWS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LWS_FTP_HOST }}
          username: ${{ secrets.LWS_FTP_USERNAME }}
          password: ${{ secrets.LWS_FTP_PASSWORD }}
          local-dir: ./public/build/
          server-dir: /diary-madagascar.com/public/build/
          dangerous-clean-slate: true
