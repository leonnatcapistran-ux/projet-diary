# Configuration Prometheus : quoi surveiller et à quelle fréquence.
global:
  scrape_interval: 15s

scrape_configs:
  # Métriques d'infrastructure : CPU/RAM/réseau de chaque conteneur (via cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Métriques de la machine hôte (via node-exporter)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Disponibilité de l'API Laravel (endpoint de santé natif : /up)
  - job_name: 'backend-health'
    metrics_path: /up
    static_configs:
      - targets: ['backend:8000']
